apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: build-and-create-imagestream-vote-api-
spec:
  pipelineRef:
    name: build-and-create-imagestream
  params:
    - name: app-name
      value: vote-api
    - name: git-url
      value: https://github.com/damonparr/pipelines-vote-api.git
    - name: git-revision
      value: master
    - name: target-namespace
      value: gitops-managed-project
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 500Mi
