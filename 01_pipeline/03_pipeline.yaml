apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-and-create-imagestream
spec:
  workspaces:
    - name: shared-workspace
  params:
    - name: app-name
      type: string
      description: Name of the application / ImageStream (vote-api or vote-ui)
    - name: git-url
      type: string
      description: Git repository URL
    - name: git-revision
      type: string
      description: Git revision/branch
      default: master
    - name: target-namespace
      type: string
      description: Target project for ImageStreams and GitOps deployments
      default: "gitops-managed-project"
  tasks:
    - name: fetch-repository
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: URL
          value: $(params.git-url)
        - name: SUBDIRECTORY
          value: ""
        - name: DELETE_EXISTING
          value: "true"
        - name: REVISION
          value: $(params.git-revision)
    - name: sast-scan
      taskSpec:
        steps:
          - name: sast-scan
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/usr/bin/env bash
              echo "Starting SAST scan on source code..."
              sleep 5
              echo "SAST scan completed successfully with 0 policy violations."
      workspaces:
        - name: source
          workspace: shared-workspace
      runAfter:
        - fetch-repository
    - name: create-imagestream
      taskRef:
        name: create-imagestream
      params:
        - name: IMAGE_STREAM_NAME
          value: $(params.app-name)
        - name: TARGET_NAMESPACE
          value: $(params.target-namespace)
      runAfter:
        - sast-scan
    - name: build-image
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: image-registry.openshift-image-registry.svc:5000/$(params.target-namespace)/$(params.app-name):latest
      workspaces:
        - name: source
          workspace: shared-workspace
      runAfter:
        - create-imagestream
    - name: integration-test
      params:
        - name: app-name
          value: $(params.app-name)
      taskSpec:
        params:
          - name: app-name
            type: string
        steps:
          - name: integration-test
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/usr/bin/env bash
              echo "Running integration tests for $(params.app-name)..."
              sleep 5
              echo "Integration tests passed successfully."
      runAfter:
        - build-image
    - name: dast-scan
      params:
        - name: app-name
          value: $(params.app-name)
      taskSpec:
        params:
          - name: app-name
            type: string
        steps:
          - name: dast-scan
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/usr/bin/env bash
              echo "Running DAST dynamic security scan against $(params.app-name)..."
              sleep 5
              echo "DAST scan completed successfully."
      runAfter:
        - integration-test